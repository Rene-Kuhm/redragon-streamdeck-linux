name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una serie de pushes seguidos al mismo PR no deberia acumular builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Las builds de CI no se depuran con gdb; ahorra tiempo y disco.
  CARGO_PROFILE_RELEASE_DEBUG: none

jobs:
  build:
    # El proyecto se distribuye como fuente que el usuario compila, asi que lo
    # que hay que garantizar es que compile en las distros que documentamos.
    # Un `install-fedora.sh` convivio con una ruta de fuente que solo existe en
    # Arch, o sea que ese instalador nunca llego a ejecutarse entero.
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:bookworm
          - distro: arch
            image: archlinux:latest

    steps:
      # Las dependencias van antes del checkout: los contenedores base no traen
      # git y actions/checkout se degradaria a descargar un tarball.
      - name: Install system dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y \
            git gcc gcc-c++ make pkgconf-pkg-config curl \
            webkit2gtk4.1-devel gtk3-devel libusb1-devel openssl-devel \
            librsvg2-devel libappindicator-gtk3-devel \
            dejavu-sans-fonts fontconfig

      - name: Install system dependencies (Debian/Ubuntu)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential pkg-config curl ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev libusb-1.0-0-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            fonts-dejavu-core fontconfig

      - name: Install system dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel pkgconf curl \
            webkit2gtk-4.1 gtk3 libusb openssl \
            librsvg libayatana-appindicator \
            ttf-dejavu fontconfig

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}

      - name: Build
        run: cargo build --release --workspace

      # Se corren en cada distro a proposito: las pruebas tocan rutas de sysfs y
      # del entorno, que es justamente lo que cambia entre distribuciones.
      - name: Test
        run: cargo test --release --workspace

  build-without-dejavu:
    # build.rs resuelve la fuente de los botones probando varias rutas y, como
    # ultimo recurso, fontconfig. Este job comprueba ese camino: sin DejaVu
    # instalada la build tiene que seguir funcionando (aca cae en Noto).
    name: build (fedora, sin DejaVu)
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install system dependencies (no DejaVu)
        run: |
          dnf install -y \
            git gcc gcc-c++ make pkgconf-pkg-config curl \
            webkit2gtk4.1-devel gtk3-devel libusb1-devel openssl-devel \
            librsvg2-devel libappindicator-gtk3-devel \
            google-noto-sans-fonts fontconfig
          # Si alguna dependencia arrastro DejaVu, sacarla: si no, el job
          # comprobaria el camino feliz y no el fallback.
          dnf remove -y dejavu-sans-fonts dejavu-fonts-all 2>/dev/null || true
          ! fc-list | grep -qi DejaVuSans.ttf || {
            echo "::error::DejaVu sigue instalada; este job no esta probando el fallback"
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora-no-dejavu

      - name: Build
        run: cargo build --release --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libusb-1.0-0-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            fonts-dejavu-core fontconfig

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # fmt y clippy arrancan informativos a proposito: el arbol viene de antes
      # de que existiera CI y todavia arrastra warnings (dead_code en las
      # funciones de weather, entre otros). Bloquear con ellos desde el dia uno
      # frenaria PRs que no tienen nada que ver. Sacar el continue-on-error
      # cuando el arbol este limpio; lo bloqueante hoy son las builds por distro.
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --release --workspace --all-targets

  release:
    # El aviso de actualizacion de la app mira los releases publicados, asi que
    # publicar uno es lo que hace llegar un cambio a los usuarios. Depende de
    # las builds por distro: nada se publica sin haber compilado en las cuatro.
    #
    # No depende de `lint` a proposito, porque hoy es informativo
    # (continue-on-error) y no deberia poder frenar una publicacion.
    name: publicar release
    needs: [build, build-without-dejavu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial completo y las etiquetas para saber desde
          # donde calcular la version.
          fetch-depth: 0

      - name: Calcular la proxima version
        id: v
        run: |
          set -euo pipefail

          ultima=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$ultima" ]; then
            rango=""
            base="0.0.0"
          else
            rango="$ultima..HEAD"
            # Se descarta cualquier sufijo tipo -tauri para poder hacer cuentas.
            base="${ultima#v}"
            base="${base%%-*}"
          fi
          echo "Ultima etiqueta: ${ultima:-(ninguna)}"

          asuntos=$(git log --format=%s ${rango:+$rango})
          cuerpos=$(git log --format=%B ${rango:+$rango})

          # Se sigue el mismo convenio que ya usan los commits del repo.
          salto=""
          # BREAKING CHANGE solo cuenta como pie de mensaje: al principio de
          # una linea y seguido de dos puntos. Buscarlo en cualquier parte del
          # cuerpo hacia que un commit que se limitara a *mencionar* la
          # convencion —como el que introdujo este job— se tomara por un cambio
          # incompatible y saltara de version mayor.
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$asuntos" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$cuerpos"; then
            salto="major"
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$asuntos"; then
            salto="minor"
          elif grep -qE '^(fix|perf|refactor)(\([^)]*\))?:' <<<"$asuntos"; then
            salto="patch"
          fi

          # Sin cambios que le importen al usuario no se publica nada: si no,
          # cada retoque de documentacion o de CI generaria una version y le
          # avisaria a todo el mundo que hay actualizacion.
          if [ -z "$salto" ]; then
            echo "Solo hubo cambios que no afectan al usuario; no se publica."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r may min par <<<"$base"
          case "$salto" in
            major) may=$((may + 1)); min=0; par=0 ;;
            minor) min=$((min + 1)); par=0 ;;
            patch) par=$((par + 1)) ;;
          esac

          etiqueta="v${may}.${min}.${par}"
          echo "Salto: $salto -> $etiqueta"

          if git rev-parse "$etiqueta" >/dev/null 2>&1; then
            echo "La etiqueta $etiqueta ya existe; no se publica."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "publicar=true"
            echo "etiqueta=$etiqueta"
            echo "anterior=$ultima"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.v.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ steps.v.outputs.etiqueta }}
          ANTERIOR: ${{ steps.v.outputs.anterior }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ETIQUETA" -m "$ETIQUETA"
          git push origin "$ETIQUETA"

          # --generate-notes arma la lista de cambios a partir de los PR
          # mergeados desde la etiqueta anterior.
          gh release create "$ETIQUETA" \
            --title "$ETIQUETA" \
            --generate-notes \
            ${ANTERIOR:+--notes-start-tag "$ANTERIOR"}
